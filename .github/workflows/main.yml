name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip Android project
        run: |
          mkdir -p build_src
          unzip -o *.zip -d build_src

      - name: Find Android project
        run: |
          echo "Searching for Android project..."
          find build_src -name "settings.gradle.kts" -o -name "settings.gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build APK
      
        run: |
          PROJECT_DIR=$(dirname "$(find build_src -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR"

          python3 - <<'PY'
          from pathlib import Path
          import re

          for p in Path("build_src").rglob("build.gradle*"):
              s = p.read_text()

              s = s.replace("JavaVersion.VERSION_1_8", "JavaVersion.VERSION_17")
              s = s.replace("JavaVersion.VERSION_8", "JavaVersion.VERSION_17")
              s = s.replace('jvmTarget = "1.8"', 'jvmTarget = "17"')
              s = s.replace("jvmTarget = '1.8'", 'jvmTarget = "17"')
              s = re.sub(r'sourceCompatibility\s*=\s*["\']1\.8["\']', 'sourceCompatibility = JavaVersion.VERSION_17', s)
              s = re.sub(r'targetCompatibility\s*=\s*["\']1\.8["\']', 'targetCompatibility = JavaVersion.VERSION_17', s)

              p.write_text(s)
          PY

          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --stacktrace
      - name: Find APK
        run: |
          find build_src -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Trading-Manager-APK
          path: build_src/**/build/outputs/apk/**/*.apk
