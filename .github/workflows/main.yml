name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Unzip Android project
        run: |
          mkdir -p build_src
          unzip -o *.zip -d build_src

          echo "=== Find ZIP files ==="
          find build_src -type f -name "*.zip"

          echo "=== Extract nested ZIP files ==="
          find build_src -type f -name "*.zip" -print0 | while IFS= read -r -d '' z; do
            d="$(dirname "$z")"
            echo "Extracting $z"
            unzip -o "$z" -d "$d"
          done

      - name: Find Android project
        run: |
          echo "=== Android projects ==="
          find build_src -name "settings.gradle.kts" -o -name "settings.gradle"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -f "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            find /usr/local/lib/android/sdk/cmdline-tools -name sdkmanager -type f || true
            exit 1
          fi

          "$SDKMANAGER" --sdk_root=/usr/local/lib/android/sdk \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build debug APK
        run: |
          PROJECT_DIR=$(dirname "$(find build_src -name 'settings.gradle.kts' -o -name 'settings.gradle' | head -n 1)")

          echo "PROJECT_DIR=$PROJECT_DIR"

          cat > /tmp/force-java17.gradle <<'GRADLE'
          allprojects {
              tasks.withType(JavaCompile).configureEach {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                  kotlinOptions.jvmTarget = "17"
              }
          }
          GRADLE

          cd "$PROJECT_DIR"

          gradle \
            --init-script /tmp/force-java17.gradle \
            :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        run: |
          echo "=== APK files ==="
          find build_src -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ETF-Trading-Manager-APK
          path: build_src/**/build/outputs/apk/**/*.apk
